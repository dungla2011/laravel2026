<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            color: #cccccc;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, select {
            padding: 8px 12px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            background: #0e639c;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        button.disconnect {
            background: #d32f2f;
        }

        button.disconnect:hover {
            background: #e53935;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.connecting {
            background: #ff9800;
        }

        .status-dot.error {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .console-container {
            flex: 1;
            display: flex;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        #consoleCanvas {
            width: 100%;
            height: 100%;
            background: #000;
            cursor: default;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
            font-size: 16px;
        }

        .message.error {
            color: #f44336;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #555;
            border-top-color: #0e639c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: -5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-panel {
            padding: 10px 20px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            font-size: 12px;
            color: #858585;
            display: flex;
            gap: 20px;
        }

        .info-item {
            display: flex;
            gap: 5px;
        }

        .info-label {
            color: #858585;
        }

        .info-value {
            color: #d4d4d4;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ VM Remote Console</h1>
        <div class="controls">
            <select id="hostSelect">
                <option value="">Select ESXi Host</option>
                <option value="10.0.1.11" selected>10.0.1.11</option>
                <option value="10.0.1.12">10.0.1.12</option>
                <option value="10.0.1.13">10.0.1.13</option>
                <option value="10.0.1.19">10.0.1.19</option>
            </select>
            <input type="text" id="vmNameInput" value="00_Backup1" placeholder="VM Name" />
            <button id="connectBtn" onclick="connectConsole()">Connect</button>
            <button id="disconnectBtn" class="disconnect" onclick="disconnectConsole()" disabled>Disconnect</button>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </div>

    <div class="console-container">
        <div id="wmksContainer" style="width: 100%; height: 100%;"></div>
        <div class="message" id="message">
            Select ESXi host and enter VM name, then click Connect
        </div>
    </div>

    <div class="info-panel">
        <div class="info-item">
            <span class="info-label">VM:</span>
            <span class="info-value" id="infoVmName">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">Host:</span>
            <span class="info-value" id="infoHost">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">State:</span>
            <span class="info-value" id="infoPowerState">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">Ticket:</span>
            <span class="info-value" id="infoTicket">-</span>
        </div>
    </div>

    <!-- VMware WMKS Library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="vmks.min.js"></script>
    <script src="console.js"></script>
</body>
</html>
