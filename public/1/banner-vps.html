<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background: #f5f5f5; font-family: 'Poppins', sans-serif;">
    
    <div style="display: flex; flex-direction: column; background: linear-gradient(135deg, #fab758 0%, #f9a825 100%); padding: 25px 40px; border-radius: 12px; max-width: 1000px; margin: 10px 10px; box-shadow: 0 10px 30px rgba(250, 183, 88, 0.4); gap: 20px;">
        
        <!-- Top Row: 3 Columns -->
        <div style="display: flex; align-items: center; justify-content: space-around; gap: 30px;">
            
            <!-- VPS Siêu tốc -->
            <div style="flex: 1; text-align: center;">
                <div style="font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 3px;">VPS Siêu tốc</div>
                <div style="font-size: 12px; color: rgba(255, 255, 255, 0.9); font-weight: 500;">NVME SSD</div>
            </div>

            <!-- Giá -->
            <div style="flex: 1; text-align: center;">
                <div style="font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 3px;">0.1 nghìn/giờ</div>
                <div style="font-size: 12px; color: rgba(255, 255, 255, 0.9); font-weight: 500;">Tính phí theo phút</div>
            </div>

            <!-- Uptime with Support 24/7 -->
            <div style="flex: 1; text-align: center;">
                <div style="font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 3px;">99.99% Uptime</div>
                <div style="font-size: 12px; color: rgba(255, 255, 255, 0.9); font-weight: 500;">✓ Support 24/7</div>
            </div>

        </div>

        <!-- Bottom Row: Logo + Domain -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 20px; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 15px;">
            
            <!-- GLX Logo -->
            <svg width="60" height="36" style="filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));"><defs><linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fab758;stop-opacity:1" /><stop offset="100%" style="stop-color:#f9a825;stop-opacity:1" /></linearGradient></defs><ellipse cx="30" cy="18" rx="27" ry="14" fill="#fff" stroke="url(#grad2)" stroke-width="1.5"></ellipse><text x="30" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="url(#grad2)" letter-spacing="0.8" style="font-family: 'Poppins', Arial, sans-serif;">GLX</text></svg>

            <!-- Domain Link -->
            <a href="https://glx.com.vn" target="_blank" style="text-decoration: none; font-size: 16px; font-weight: 600; color: #fff; padding: 8px 16px; background: rgba(255, 255, 255, 0.2); border-radius: 6px; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.background='rgba(255, 255, 255, 0.3); this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.2); this.style.transform='scale(1)'">
                https://glx.com.vn
            </a>

        </div>

    </div>

</body>
</html>
